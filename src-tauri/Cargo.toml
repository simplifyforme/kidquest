[package]
name = "kidquest"
version = "0.4.0"
description = "Plateforme éducative hors ligne pour enfants"
authors = ["KidQuest Contributors"]
edition = "2021"

[lib]
name = "kidquest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
