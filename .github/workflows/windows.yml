name: Windows installer
on:
  push:
    branches: [main, feat/kidquest-mvp]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm install
      - name: Validate and regenerate content + catalog manifest
        run: node scripts/generate-manifest.mjs
      - name: Typecheck and build frontend
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Package Windows application
        run: npm run tauri build
      - name: Startup smoke test (diagnostic)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "src-tauri/target/release/kidquest.exe"
          if (!(Test-Path $exe)) { throw "App executable not found: $exe" }
          $proc = Start-Process -FilePath (Resolve-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) {
            Write-Host "KidQuest exited early with code $($proc.ExitCode)"
            if (Test-Path "$env:TEMP/KidQuest-startup-error.log") {
              Get-Content "$env:TEMP/KidQuest-startup-error.log"
            }
            throw "KidQuest closed immediately after launch."
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "KidQuest remained open during the smoke test."
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: kidquest-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
