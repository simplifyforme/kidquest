name: Publish exercise catalog
on:
  push:
    branches: [main]
    paths:
      - 'site/packs/**'
      - 'site/catalog.json'
      - 'scripts/generate-manifest.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: content-catalog
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate content manifest with SHA-256
        run: node scripts/generate-manifest.mjs
      - name: Publish manifest into the public repository
        run: |
          git add site/manifest.json
          if git diff --cached --quiet; then
            echo "Content manifest already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(content): regenerate verified pack manifest"
            git push origin HEAD:main
          fi
